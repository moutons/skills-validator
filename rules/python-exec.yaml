rules:
  - id: python-eval
    patterns:
      - pattern: eval(...)
    message: >
      eval() executes arbitrary Python expressions. Avoid with untrusted input.
    languages: [python]
    severity: WARNING

  - id: python-exec
    patterns:
      - pattern: exec(...)
    message: >
      exec() executes arbitrary Python code. Avoid with untrusted input.
    languages: [python]
    severity: WARNING

  - id: python-subprocess-shell
    patterns:
      - pattern: subprocess.call(..., shell=True, ...)
    message: >
      subprocess.call with shell=True is vulnerable to shell injection.
    languages: [python]
    severity: WARNING

  - id: python-subprocess-run-shell
    patterns:
      - pattern: subprocess.run(..., shell=True, ...)
    message: >
      subprocess.run with shell=True is vulnerable to shell injection.
    languages: [python]
    severity: WARNING

  - id: python-os-system
    patterns:
      - pattern: os.system(...)
    message: >
      os.system() is vulnerable to shell injection. Use subprocess with a list instead.
    languages: [python]
    severity: WARNING
