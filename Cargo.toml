[package]
name = "skills-validator"
version = "0.1.8"
edition = "2021"
description = "This tool validates agent skills according to the Agent Skills specification, informed by the OpenCode and Claude Code implementations."
license = "Apache-2.0"
authors = ["moutons <sdmouton@gmail.com>"]
repository = "https://github.com/moutons/skills-validator"

[lib]
name = "skills_validator"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
html-escape = "0.2"
thiserror = "2.0"
unicode-normalization = "0.1"
log = "0.4"
env_logger = "0.11"
owo-colors = { version = "4", features = ["supports-colors"] }
regex = "1.10"
dirs = "5.0"
git2 = "0.19"
walkdir = "2.5"
rayon = "1.10"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "skills-validator"
path = "src/main.rs"
