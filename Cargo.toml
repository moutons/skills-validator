[package]
name = "skills-validator"
version = "0.1.0"
edition = "2021"
description = "Reference library for Agent Skills"
license = "Apache-2.0"
authors = ["moutons <sdmouton@gmail.com>"]
repository = "https://github.com/agentskills/skills-validator"

[lib]
name = "skills_validator"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
html-escape = "0.2"
thiserror = "1.0"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "skills-validator"
path = "src/main.rs"
